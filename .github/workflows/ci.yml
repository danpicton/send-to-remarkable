name: CI and container

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.6.9'
          enable-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install native rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-dejavu-core
      - run: uv sync --frozen
      - run: uv run --no-sync pytest
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check app tests scripts
      - run: node --test tests/*.test.mjs

  container-check:
    name: Build and smoke-test container
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: send-to-remarkable:test
          cache-from: type=gha,scope=container-amd64
          cache-to: type=gha,mode=max,scope=container-amd64
      - name: Check non-root, read-only runtime and both document formats
        run: |
          docker run --rm -i --read-only --tmpfs /tmp:rw,nosuid,size=128m \
            --memory=1g --cpus=2 --network=none \
            --volume "$PWD/tests/fixtures:/fixtures:ro" \
            --entrypoint python send-to-remarkable:test - < scripts/container_smoke.py

  publish:
    name: Publish release image
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [test, container-check]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate release tag and set image name
        id: image
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo 'Use a version tag such as v0.1.0 or v0.2.0-rc.1.' >&2
            exit 1
          fi
          echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          if [[ "$RELEASE_TAG" == *-* ]]; then
            echo 'stable=false' >> "$GITHUB_OUTPUT"
          else
            echo 'stable=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ steps.image.outputs.stable == 'true' }}
            type=raw,value=latest,enable=${{ steps.image.outputs.stable == 'true' }}
            type=sha,format=long
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=AGPL-3.0-only
      - name: Check that metadata resolved the release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          IMAGE_VERSION: ${{ steps.meta.outputs.version }}
        run: test "$IMAGE_VERSION" = "${RELEASE_TAG#v}"
      - name: Build and push amd64 and arm64 images
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=container-amd64
            type=gha,scope=container-release
          cache-to: type=gha,mode=max,scope=container-release
          provenance: true
          sbom: true
